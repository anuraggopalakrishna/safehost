<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Network Threat Detection</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px 80px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            font-size: 2.2em;
            color: #1a237e;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 30px;
        }

        .tools {
            text-align: left;
            background-color: #eef2f7;
            padding: 20px;
            border-radius: 10px;
        }

        .tools h2 {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 10px;
        }

        .tools ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .tools ul li {
            padding: 5px 0;
            font-size: 0.95em;
        }

        .badge {
            display: inline-block;
            background-color: #1a237e;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            margin-left: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>AI Network Threat Detection using ML</h1>
        <p class="subtitle">A real-time solution for analyzing network traffic and detecting threats.</p>
        <div class="tools">
            <h2>Technologies Used:</h2>
            <ul>
                <li>🧪 Wireshark <span class="badge">Packet Sniffing</span></li>
                <li>🐍 Python <span class="badge">Backend Logic</span></li>
                <li>🌲 Random Forest <span class="badge">ML Classification</span></li>
                <li>📊 Streamlit <span class="badge">Live Dashboards</span></li>
                <li>🌐 Flask <span class="badge">Web Server</span></li>
            </ul>
        </div>
    </div>
</body>

</html>
